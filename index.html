<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
 <header>
        <h1>Community Support Tracker</h1>
        <h3>PiXELL River Financial</h3>
        <p>Track donations, volunteer hours and event implication.</p>
    </header>

    <nav>
        <ul>
            <li><a href="donations.html">Donations</a></li>
            <li><a href="volunteer.html">Volunteer Hours</a></li>
            <li><a href="events.html">Event Signup</a></li>
        </ul>
    </nav>

    <main>
        <h2>Donation Tracker</h2>

        <form id="donationForm">

            <label for="charityName">Charity Name</label>
            <input type="text" id="charityName" required>

            <label for="donationAmount">Donation Amount</label>
            <input type="number" id="donationAmount" required>

            <label for="donationDate">Date of Donation</label>
            <input type="date" id="donationDate" required>

            <label for="comment">Donor Comment</label>
            <textarea id="comment"></textarea>

            <button type="submit">Add Donation</button>

        </form>

        <h2>Volunteer Hours Tracker</h2>
        <p>Enter your volunteer hours and rate your experience.</p>
        <form action="" id="volunteer-form">
            <label for="charity-name">Name of charity:</label>
            <input type="text" id="charity-name" required>
            <label for="hours">Numbers of hours:</label>
            <input type="number" id="hours" required>
            <label for="volunteer-date">Date of volunteering:</label>
            <input type="date" id="volunteer-date" required>
            <label for="rating">Rate your experience:</label>
            <input type="range" id="rating">
        </form>

        <div id="message"></div>
    </main>

    <footer>
        <p>&copy; 2026 PiXELL River Financial</p>
    </footer>

    <script src="js/script.js"></script>
</body>
</html>
